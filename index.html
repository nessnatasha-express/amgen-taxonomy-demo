  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"065137e5-a41d-4530-97f1-50050e580b29\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* ============================================================\n   Amgen Taxonomy Activation — design-system entry.\n   Dentsu token layer (fonts.css omitted — Amgen uses system\n   Helvetica) + the Amgen brand theme overrides on top.\n   Link THIS file once.\n   ============================================================ */\n/* ============================================================\n   Dentsu Creative — Color Tokens\n   Sources (reconciled): DC_COLOR_BREAKDOWNS.pdf + the official\n   PowerPoint theme \"Dentsu Creative 2026\" (DC_PRESENTATION_TEMPLATE).\n   Theme mapping: dk1=black, lt1=white, dk2=off-white paper,\n   lt2=Acer Red, accent1=blossom, accent2=support-pink,\n   accent3=forest, accent4=support-green, accent5=support-blue,\n   accent6=mountain-blue. hlink (links) = forest green.\n   The palette is rooted in Japanese heritage — note the Japanese\n   names that accompany each hue. Black + off-white are the canvas;\n   RED IS AN EXTREME-HIGHLIGHT ACCENT ONLY (never a large fill).\n   ============================================================ */\n:root {\n  /* ---------- Brand / primary ---------- */\n  --dc-acer-red: #cc2126;       /* 芸者赤  geisha red — the signature DC accent */\n  --dc-forest-green: #0f4036;   /* フォレストグリーン */\n  --dc-mountain-blue: #16385c;  /* マウンテンブルー — theme accent6 */\n\n  /* ---------- Neutrals ---------- */\n  --dc-black: #000000;          /* ブラック */\n  --dc-white: #ffffff;          /* 白 */\n  --dc-off-white: #f7f0e3;      /* オフホワイト — warm paper canvas */\n\n  /* ---------- Support / secondary ---------- */\n  --dc-blossom-pink: #f2a6a6;   /* 桃 */\n  --dc-support-pink: #ffd2d2;\n  --dc-support-green: #3e7350;\n  --dc-support-blue: #071c32;\n\n  /* ---------- Derived neutral ramp (off-white → black) ---------- */\n  /* Built from the canvas paper tone so greys read warm, not clinical. */\n  --dc-paper-100: #f7f0e3;\n  --dc-paper-200: #ece4d4;\n  --dc-grey-300: #cfc9bd;\n  --dc-grey-400: #a8a299;\n  --dc-grey-500: #767069;\n  --dc-grey-600: #4a4641;\n  --dc-grey-700: #2a2724;\n  --dc-grey-900: #121110;\n\n  /* ---------- Tints of the accent (for fills, hovers, states) ---------- */\n  --dc-acer-red-12: rgba(204, 33, 38, 0.12);\n  --dc-acer-red-24: rgba(204, 33, 38, 0.24);\n  --dc-acer-red-press: #a81a1f;   /* darker red for active/press */\n  --dc-acer-red-hover: #b81d22;\n\n  /* ============================================================\n     Semantic aliases — reference these in components, not raw hues\n     ============================================================ */\n\n  /* Surfaces */\n  --surface-page: var(--dc-off-white);\n  --surface-card: var(--dc-white);\n  --surface-inverse: var(--dc-black);\n  --surface-sunken: var(--dc-paper-200);\n  --surface-accent: var(--dc-acer-red);\n  --surface-accent-soft: var(--dc-support-pink);\n  --surface-forest: var(--dc-forest-green);\n  --surface-blue: var(--dc-mountain-blue);\n\n  /* Text */\n  --text-strong: var(--dc-black);\n  --text-body: var(--dc-grey-700);\n  --text-muted: var(--dc-grey-500);\n  --text-on-dark: var(--dc-off-white);\n  --text-on-accent: var(--dc-white);\n  --text-accent: var(--dc-acer-red);\n  --text-link: var(--dc-forest-green);   /* theme hlink — links are forest green, NOT red */\n\n  /* Borders / lines */\n  --border-hairline: var(--dc-grey-300);\n  --border-strong: var(--dc-black);\n  --border-accent: var(--dc-acer-red);\n  --border-on-dark: rgba(247, 240, 227, 0.24);\n\n  /* Feedback */\n  --feedback-danger: var(--dc-acer-red);\n  --feedback-success: var(--dc-support-green);\n  --feedback-info: var(--dc-mountain-blue);\n\n  /* Focus ring */\n  --focus-ring: var(--dc-acer-red);\n}\n\n/* ============================================================\n   Dentsu Creative — Typography Tokens\n   Stabil Grotesk is the voice: a confident, slightly humanist\n   grotesque. Display is set TIGHT, BIG and often UPPERCASE.\n   Noto Sans JP carries Japanese text and pairs 1:1 in weight.\n   ============================================================ */\n:root {\n  /* ---------- Families ---------- */\n  --font-display: \"Stabil Grotesk\", \"Noto Sans JP\", \"Helvetica Neue\", Arial, sans-serif;\n  --font-body: \"Stabil Grotesk\", \"Noto Sans JP\", \"Helvetica Neue\", Arial, sans-serif;\n  --font-jp: \"Noto Sans JP\", \"Stabil Grotesk\", sans-serif;\n  --font-mono: ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n\n  /* ---------- Weights ---------- */\n  --fw-light: 300;   /* @kind font */\n  --fw-regular: 400; /* @kind font */\n  --fw-bold: 700;    /* @kind font */\n  --fw-black: 900;   /* @kind font */\n\n  /* ---------- Type scale (1.250 major-third, 16px base) ---------- */\n  --fs-3xs: 0.694rem;   /* 11px — labels, captions */\n  --fs-2xs: 0.75rem;    /* 12px */\n  --fs-xs: 0.875rem;    /* 14px */\n  --fs-sm: 1rem;        /* 16px — base body */\n  --fs-md: 1.125rem;    /* 18px — lead body */\n  --fs-lg: 1.5rem;      /* 24px */\n  --fs-xl: 2rem;        /* 32px */\n  --fs-2xl: 2.75rem;    /* 44px */\n  --fs-3xl: 3.75rem;    /* 60px */\n  --fs-4xl: 5rem;       /* 80px */\n  --fs-5xl: 7rem;       /* 112px — hero / poster */\n  --fs-6xl: 9.5rem;     /* 152px — oversized statement */\n\n  /* ---------- Line heights ---------- */\n  --lh-tight: 0.95;   /* @kind other */ /* display lockups */\n  --lh-snug: 1.08;    /* @kind other */ /* headlines */\n  --lh-base: 1.5;     /* @kind other */ /* body */\n  --lh-relaxed: 1.65; /* @kind other */ /* long-form */\n\n  /* ---------- Letter spacing ---------- */\n  --ls-mega: -0.03em;   /* huge display, pulls letters together @kind other */\n  --ls-tight: -0.015em; /* headlines @kind other */\n  --ls-normal: 0em;     /* @kind other */\n  --ls-label: 0.08em;   /* uppercase eyebrows / labels @kind other */\n  --ls-caps: 0.12em;    /* spaced-out caps @kind other */\n\n  /* ============================================================\n     Semantic text roles\n     ============================================================ */\n  --text-hero-size: var(--fs-5xl);\n  --text-hero-weight: var(--fw-black);\n  --text-hero-lh: var(--lh-tight);\n  --text-hero-ls: var(--ls-mega);\n\n  --text-display-size: var(--fs-3xl);\n  --text-display-weight: var(--fw-bold);\n  --text-display-lh: var(--lh-snug);\n\n  --text-h1-size: var(--fs-2xl);\n  --text-h2-size: var(--fs-xl);\n  --text-h3-size: var(--fs-lg);\n\n  --text-body-size: var(--fs-sm);\n  --text-body-lh: var(--lh-base);\n\n  --text-label-size: var(--fs-3xs);\n  --text-label-ls: var(--ls-label);\n}\n\n/* ============================================================\n   Dentsu Creative — Spacing, Radius, Shadow, Layout Tokens\n   The system is built on an 8px grid. Corners are largely\n   SQUARE — the brand leans architectural and editorial. Radius\n   is reserved for pills/avatars. Shadows are minimal; structure\n   comes from rules and flat colour blocks, not elevation.\n   ============================================================ */\n:root {\n  /* ---------- Spacing (8px base grid) ---------- */\n  --space-0: 0;\n  --space-1: 0.25rem;   /* 4 */\n  --space-2: 0.5rem;    /* 8 */\n  --space-3: 0.75rem;   /* 12 */\n  --space-4: 1rem;      /* 16 */\n  --space-5: 1.5rem;    /* 24 */\n  --space-6: 2rem;      /* 32 */\n  --space-7: 3rem;      /* 48 */\n  --space-8: 4rem;      /* 64 */\n  --space-9: 6rem;      /* 96 */\n  --space-10: 8rem;     /* 128 */\n\n  /* ---------- Radius (mostly square brand) ---------- */\n  --radius-none: 0;\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 8px;\n  --radius-pill: 999px;\n  --radius-circle: 50%;\n\n  /* ---------- Border widths ---------- */\n  --bw-hairline: 1px;\n  --bw-regular: 1.5px;\n  --bw-strong: 2px;\n  --bw-heavy: 3px;\n\n  /* ---------- Shadows (used sparingly) ---------- */\n  --shadow-none: none;\n  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.06);\n  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);\n  --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);\n  /* Editorial \"offset block\" shadow — a hard accent shadow, no blur */\n  --shadow-block: 8px 8px 0 var(--dc-black);\n  --shadow-block-accent: 8px 8px 0 var(--dc-acer-red);\n\n  /* ---------- Layout ---------- */\n  --container-sm: 640px;\n  --container-md: 960px;\n  --container-lg: 1200px;\n  --container-xl: 1440px;\n  --gutter: var(--space-5);\n\n  /* ---------- Motion ---------- */\n  /* Confident, quick, no bounce. Easing is brisk ease-out. */\n  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);     /* @kind other */\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);  /* @kind other */\n  --dur-fast: 120ms;   /* @kind other */\n  --dur-base: 200ms;   /* @kind other */\n  --dur-slow: 360ms;   /* @kind other */\n\n  /* ---------- Z-index ---------- */\n  --z-base: 1;        /* @kind other */\n  --z-sticky: 100;    /* @kind other */\n  --z-overlay: 1000;  /* @kind other */\n  --z-toast: 2000;    /* @kind other */\n}\n\n/* ============================================================\n   Dentsu Creative — Base element styling & helpers\n   Light-touch resets and the editorial defaults that make raw\n   HTML look \"on brand\" without component wrappers.\n   ============================================================ */\n\n*,\n*::before,\n*::after {\n  box-sizing: border-box;\n}\n\nhtml {\n  -webkit-text-size-adjust: 100%;\n}\n\nbody {\n  margin: 0;\n  font-family: var(--font-body);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-sm);\n  line-height: var(--lh-base);\n  color: var(--text-body);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* ---------- Headings: tight, dark, confident ---------- */\nh1, h2, h3, h4, h5, h6 {\n  margin: 0;\n  font-family: var(--font-display);\n  color: var(--text-strong);\n  letter-spacing: var(--ls-tight);\n  line-height: var(--lh-snug);\n  font-weight: var(--fw-bold);\n  text-wrap: balance;\n}\n\np {\n  margin: 0;\n  text-wrap: pretty;\n}\n\na {\n  color: var(--text-link);\n  text-decoration: none;\n}\na:hover {\n  text-decoration: underline;\n  text-underline-offset: 0.18em;\n}\n\n/* ---------- Display utility classes ---------- */\n.dc-eyebrow {\n  font-family: var(--font-display);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-3xs);\n  letter-spacing: var(--ls-label);\n  text-transform: uppercase;\n  color: var(--text-accent);\n}\n\n.dc-hero {\n  font-family: var(--font-display);\n  font-weight: var(--fw-black);\n  font-size: var(--fs-5xl);\n  line-height: var(--lh-tight);\n  letter-spacing: var(--ls-mega);\n  text-transform: uppercase;\n  color: var(--text-strong);\n}\n\n.dc-display {\n  font-family: var(--font-display);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-3xl);\n  line-height: var(--lh-snug);\n  letter-spacing: var(--ls-tight);\n  color: var(--text-strong);\n}\n\n.dc-jp {\n  font-family: var(--font-jp);\n}\n\n/* ---------- Button interaction states ---------- */\n.dc-btn { -webkit-tap-highlight-color: transparent; }\n.dc-btn:not(:disabled):active { transform: translateY(1px); }\n.dc-btn--primary:not(:disabled):hover { background: var(--dc-acer-red-hover) !important; border-color: var(--dc-acer-red-hover) !important; }\n.dc-btn--primary:not(:disabled):active { background: var(--dc-acer-red-press) !important; border-color: var(--dc-acer-red-press) !important; }\n.dc-btn--ink:not(:disabled):hover { background: var(--dc-grey-700) !important; border-color: var(--dc-grey-700) !important; }\n.dc-btn--outline:not(:disabled):hover { background: var(--dc-black) !important; color: var(--dc-off-white) !important; }\n.dc-btn--ghost:not(:disabled):hover { background: var(--dc-paper-200) !important; }\n\n/* ---------- Focus ---------- */\n:focus-visible {\n  outline: var(--bw-strong) solid var(--focus-ring);\n  outline-offset: 2px;\n}\n\n/* ---------- Selection ---------- */\n::selection {\n  background: var(--dc-acer-red);\n  color: var(--dc-white);\n}\n\n/* ============================================================\n   Amgen brand theme — overrides the Dentsu token layer so the\n   whole experience reads as Amgen: Amgen Blue #0063C3, Nile Blue\n   #1A3856, white, Helvetica, rounded corners, soft elevation.\n   Load AFTER the DS token CSS.\n   ============================================================ */\n:root {\n  /* ---- Amgen palette ---- */\n  --am-blue: #0063C3;          /* Amgen Blue — primary */\n  --am-blue-hover: #0056ab;\n  --am-blue-press: #004a93;\n  --am-blue-12: rgba(0, 99, 195, 0.12);\n  --am-blue-24: rgba(0, 99, 195, 0.22);\n  --am-cyan: #00A3E0;          /* bright accent */\n  --am-grad-from: #006BC6;     /* brand gradient start */\n  --am-grad-to: #00BAE3;       /* brand gradient end */\n  --am-gradient: linear-gradient(100deg, #006BC6 0%, #00BAE3 100%);\n  --am-nile: #1A3856;          /* Nile Blue — deep ink / dark surface */\n  --am-nile-deep: #0f2740;     /* deeper navy for full-bleed dark */\n  --am-ink: #15293f;           /* near-black navy for text */\n  --am-teal: #1f8a6b;          /* supporting green/teal for \"valid\" */\n  --am-teal-bg: #e6f4ee;\n  --am-amber: #b9791a;\n  --am-amber-bg: #fbf0dd;\n  --am-red: #c0392b;\n  --am-red-bg: #fbeae7;\n  --am-page: #EDF2F7;\n  --am-card: #ffffff;\n  --am-sunken: #e2eaf3;\n  --am-hairline: #d5e0ec;\n  --am-body: #44525e;\n  --am-muted: #74828f;\n\n  /* ---- remap Dentsu tokens to Amgen ---- */\n  --dc-acer-red: var(--am-blue);\n  --dc-acer-red-hover: var(--am-blue-hover);\n  --dc-acer-red-press: var(--am-blue-press);\n  --dc-acer-red-12: var(--am-blue-12);\n  --dc-acer-red-24: var(--am-blue-24);\n  --dc-black: var(--am-nile);          /* ink + structural borders → Nile */\n  --dc-off-white: #ffffff;\n  --dc-mountain-blue: var(--am-nile);\n  --dc-forest-green: var(--am-teal);\n  --dc-support-green: var(--am-teal);\n  --dc-blossom-pink: var(--am-cyan);\n  --dc-support-pink: var(--am-blue-12);\n  --dc-paper-100: #f4f8fc;\n  --dc-paper-200: var(--am-sunken);\n  --dc-grey-300: var(--am-hairline);\n  --dc-grey-400: #aab8c5;\n  --dc-grey-500: var(--am-muted);\n  --dc-grey-600: #50606e;\n  --dc-grey-700: var(--am-body);\n  --dc-grey-900: var(--am-ink);\n\n  /* semantic */\n  --surface-page: var(--am-page);\n  --surface-card: var(--am-card);\n  --surface-sunken: var(--am-sunken);\n  --surface-inverse: var(--am-nile);\n  --surface-accent: var(--am-blue);\n  --surface-blue: var(--am-nile);\n  --surface-forest: var(--am-teal);\n  --text-strong: var(--am-ink);\n  --text-body: var(--am-body);\n  --text-muted: var(--am-muted);\n  --text-on-dark: #ffffff;\n  --text-accent: var(--am-blue);\n  --text-link: var(--am-blue);\n  --border-hairline: var(--am-hairline);\n  --border-strong: var(--am-nile);\n  --border-accent: var(--am-blue);\n  --focus-ring: var(--am-blue);\n  --feedback-success: var(--am-teal);\n  --feedback-info: var(--am-blue);\n\n  /* ---- type: Amgen leans Helvetica ---- */\n  --font-display: \"Helvetica Neue\", Helvetica, \"Segoe UI\", Arial, sans-serif;\n  --font-body: \"Helvetica Neue\", Helvetica, \"Segoe UI\", Arial, sans-serif;\n  --font-mono: \"SF Mono\", ui-monospace, Menlo, Consolas, monospace;\n  --ls-tight: -0.01em;\n  --ls-mega: -0.02em;\n\n  /* ---- softer, rounder, modern ---- */\n  --radius-sm: 6px;\n  --radius-md: 12px;\n  --radius-lg: 16px;\n  --bw-regular: 1px;\n  --bw-strong: 1.5px;\n  --shadow-sm: 0 1px 2px rgba(21, 41, 63, 0.06);\n  --shadow-md: 0 4px 16px rgba(21, 41, 63, 0.08);\n  --shadow-lg: 0 18px 48px rgba(21, 41, 63, 0.16);\n  --shadow-block: 0 6px 22px rgba(21, 41, 63, 0.10);\n  --shadow-block-accent: 0 12px 32px rgba(0, 99, 195, 0.22);\n}\n\nh1, h2, h3, h4, h5, h6 { letter-spacing: var(--ls-tight); font-weight: 700; }\na { color: var(--am-blue); }\n::selection { background: var(--am-blue); color: #fff; }\ninput[type=\"checkbox\"], input[type=\"radio\"] { accent-color: var(--am-blue); }\n\n<\u002Fstyle>\n<script src=\"a7f17e05-bc1a-4cff-882b-746d0ff81400\"><\u002Fscript>\n<style>\n  body { margin:0; background:var(--am-page); }\n  .fade-in { animation: fadeIn .42s var(--ease-out) both; }\n  @keyframes fadeIn { from { transform:translateY(10px); } to { transform:none; } }\n  @keyframes rowIn { from { transform:translateY(18px); } to { transform:none; } }\n  @keyframes colIn { from { transform:translateY(16px); } to { transform:none; } }\n  @keyframes popIn { from { transform:translateY(10px) scale(.985); } to { transform:none; } }\n  @keyframes slideInL { from { transform:translateX(-16px); } to { transform:none; } }\n  @keyframes floatUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }\n  .jrow { transition: transform var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out); cursor:pointer; }\n  .jrow:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }\n  .jrow:hover .goarr { transform: translateX(3px); }\n  .lift:hover .goarr-en { transform: translateX(3px); background: rgba(255,255,255,0.30); }\n  .lift { transition: transform var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out); }\n  .lift:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }\n  .btn-press { transition: transform var(--dur-fast) var(--ease-out), filter var(--dur-fast) var(--ease-out); }\n  .btn-press:hover { filter: brightness(1.04); }\n  .btn-press:active { transform: translateY(1px) scale(.985); }\n  .cta-lift { transition: transform var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out); }\n  .cta-lift:hover { transform: translateY(-2px); box-shadow: var(--shadow-block-accent); }\n  .pop-anim { animation: popIn .4s var(--ease-out) both; }\n  .left-anim { animation: slideInL .4s var(--ease-out) both; }\n  .homelink { cursor:pointer; transition: opacity var(--dur-fast) var(--ease-out); }\n  .homelink:hover { opacity:.6; }\n  .en-card { transition: border-color var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out); }\n  .en-card:hover { border-color: #2f9bff; transform: translateY(-3px); }\n  .kpi-tab { transition: transform .16s var(--ease-out), border-color .16s var(--ease-out), color .16s var(--ease-out); }\n  .kpi-tab:hover { transform: translateY(-2px) scale(1.05); border-color: #00BCE4; color: #00BCE4; }\n  .kpi-tab-on { transition: transform .16s var(--ease-out); }\n  .kpi-tab-on:hover { transform: translateY(-2px) scale(1.05); }\n  .tab-hint-arrow { display:inline-block; animation: shBounce 1.2s ease-in-out infinite; }\n  @media (prefers-reduced-motion: reduce) { .tab-hint-arrow { animation: none; } }\n  image-slot { display:block; }\n  /* mount reveal / slide-ins */\n  @keyframes revUp { from { transform:translateY(32px); } to { transform:none; } }\n  @keyframes revScale { from { transform:translateY(24px) scale(.965); } to { transform:none; } }\n  @keyframes revLeft { from { transform:translateX(-34px); } to { transform:none; } }\n  @keyframes revRight { from { transform:translateX(34px); } to { transform:none; } }\n  [data-reveal] { animation: revUp .62s cubic-bezier(0.16,1,0.3,1) both; }\n  [data-reveal=\"scale\"] { animation-name: revScale; }\n  [data-reveal=\"left\"] { animation-name: revLeft; }\n  [data-reveal=\"right\"] { animation-name: revRight; }\n  [data-reveal-delay] { animation-delay: var(--rd, 0s); }\n  @media (prefers-reduced-motion: reduce) { [data-reveal] { animation: none; } .fade-in,.pop-anim,.left-anim { animation: none; } }\n  /* review scroll hint */\n  @keyframes shBounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(9px); } }\n  @keyframes shFade { to { opacity: 0; visibility: hidden; } }\n  .scroll-hint { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 40; display: flex; flex-direction: column; align-items: center; gap: 7px; pointer-events: none; transition: opacity .4s var(--ease-out), transform .4s var(--ease-out); }\n  .scroll-hint.sh-hidden { opacity: 0; transform: translateX(-50%) translateY(10px); }\n  .scroll-hint .sh-label { font-family: var(--font-display); font-weight: 700; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--am-blue); background: rgba(255,255,255,0.85); padding: 4px 11px; border-radius: 999px; box-shadow: var(--shadow-sm); }\n  .scroll-hint .sh-arrow { width: 42px; height: 42px; border-radius: 50%; background: var(--am-blue); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 22px rgba(0,99,195,0.4); animation: shBounce 1.5s ease-in-out infinite; }\n  @media (prefers-reduced-motion: reduce) { .scroll-hint .sh-arrow { animation: none; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div class=\"appwrap\" style=\"min-height:100vh;font-family:var(--font-body);color:var(--text-body)\">\n\n  <!-- ===================== SPLASH ===================== -->\n  <sc-if value=\"{{ isSplash }}\" hint-placeholder-val=\"{{ true }}\">\n    <div class=\"fade-in\" style=\"position:relative;min-height:100vh;overflow:hidden;background:linear-gradient(118deg,#00488f 0%,#0063C3 46%,#00A3E0 100%)\">\n      <div style=\"position:absolute;right:-160px;top:-180px;width:640px;height:640px;border-radius:50%;background:rgba(255,255,255,0.10)\"><\u002Fdiv>\n      <div style=\"position:absolute;right:160px;top:240px;width:340px;height:340px;border-radius:50%;background:rgba(255,255,255,0.07)\"><\u002Fdiv>\n      <div style=\"position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;padding:46px clamp(32px,6vw,84px);box-sizing:border-box\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px\">\n          <div style=\"display:flex;align-items:center;gap:16px\">\n            <img src=\"3a3d12e7-24b5-4eb2-b993-89a22d97913c\" alt=\"Amgen\" style=\"height:30px;width:auto;display:block\">\n            <span style=\"width:1px;height:26px;background:rgba(255,255,255,0.4)\"><\u002Fspan>\n            <span style=\"font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:rgba(255,255,255,0.9)\">Taxonomy Activation<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border:1px solid rgba(255,255,255,0.4);border-radius:999px;font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#fff\"><span style=\"width:7px;height:7px;border-radius:50%;background:#fff\"><\u002Fspan>Demonstration<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"max-width:820px;padding:40px 0\">\n          <span style=\"font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.82)\">Enterprise taxonomy approach<\u002Fspan>\n          <h1 style=\"font-family:var(--font-display);font-weight:700;letter-spacing:-0.02em;font-size:clamp(40px,6vw,66px);line-height:1.02;color:#fff;margin:18px 0 0\">See enterprise taxonomy come to&nbsp;life across every campaign.<\u002Fh1>\n          <p style=\"font-size:clamp(16px,1.5vw,19px);line-height:1.6;color:rgba(255,255,255,0.92);margin:24px 0 0;max-width:64ch\">This prototype is for demonstration purposes only. It shows how key scenarios and campaigns are brought to life through intelligent workflows and thoughtful process strategies across Amgen's cross-channel taxonomy design — for both agency partners and internal staff.<\u002Fp>\n          <div style=\"display:flex;gap:14px;margin-top:34px;flex-wrap:wrap\">\n            <button class=\"btn-press\" onclick=\"{{ enter }}\" style=\"display:inline-flex;align-items:center;gap:10px;padding:16px 28px;background:#fff;color:var(--am-blue);border:none;border-radius:10px;font-family:var(--font-display);font-weight:700;font-size:16px;cursor:pointer\">Choose a campaign scenario <span style=\"font-size:18px\">→<\u002Fspan><\u002Fbutton>\n          <\u002Fdiv>\n          <p style=\"font-size:13.5px;color:rgba(255,255,255,0.72);margin:18px 0 0\">To begin, select a campaign scenario to review at a glance — then walk every step alongside the system it happens in.<\u002Fp>\n        <\u002Fdiv>\n\n        <div><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== JOURNEY MENU ===================== -->\n  <sc-if value=\"{{ isMenu }}\" hint-placeholder-val=\"{{ true }}\">\n    <div class=\"fade-in\" style=\"min-height:100vh;display:flex;flex-direction:column;background:var(--am-page)\">\n      <div style=\"height:64px;flex:none;background:#fff;border-bottom:1px solid var(--am-hairline);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,4vw,40px);position:sticky;top:0;z-index:10\">\n        <div style=\"display:flex;align-items:center;gap:14px\">\n          <img src=\"b4203065-d4be-4ad9-8458-7e0bfdc00ed3\" alt=\"Amgen\" title=\"Back to start\" class=\"homelink\" onclick=\"{{ goSplash }}\" style=\"height:22px;width:auto;display:block\">\n          <span style=\"width:1px;height:20px;background:var(--am-hairline)\"><\u002Fspan>\n          <span style=\"font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-muted)\">Taxonomy Activation<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border:1px solid var(--am-hairline);background:#fff;border-radius:999px;font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-strong)\"><span style=\"width:7px;height:7px;border-radius:50%;background:var(--am-teal)\"><\u002Fspan>Demonstration<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"flex:1;width:100%;max-width:11 700;font-size:18px;color:var(--text-strong);margin:0\">Grounding in foundations<\u002Fh3>\n            <p style=\"font-size:13.5px;line-height:1.5;color:var(--text-muted);margin:5px 0 0\">Every scenario stands on the same shared groundwork that each audience learns first.<\u002Fp>\n            <div style=\"display:flex;flex-wrap:wrap;gap:7px;margin-top:11px\">\n              <span style=\"padding:5px 12px;border-radius:999px;background:var(--am-page);font-family:var(--font-display);font-weight:600;font-size:12px;color:var(--text-body)\">Production methodology<\u002Fspan>\n              <span style=\"padding:5px 12px;border-radius:999px;background:var(--am-page);font-family:var(--font-display);font-weight:600;font-size:12px;color:var(--text-body)\">Data dictionary &amp; taxonomy<\u002Fspan>\n              <span style=\"padding:5px 12px;border-radius:999px;background:var(--am-page);font-family:var(--font-display);font-weight:600;font-size:12px;color:var(--text-body)\">Channels &amp; technology<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <span class=\"goarr\" style=\"flex:none;width:44px;height:44px;border-radius:50%;background:var(--am-blue-12);color:var(--am-blue);display:grid;place-items:center;font-size:19px;transition:all var(--dur-base) var(--ease-out)\">→<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:18px;margin-top:18px\">\n          <sc-for list=\"{{ journeys }}\" as=\"j\" hint-placeholder-count=\"3\">\n            <div class=\"jrow\" onclick=\"{{ j.onOpen }}\" style=\"background:#fff;border:1px solid var(--am-hairline);border-radius:16px;box-shadow:var(--shadow-sm);padding:18px;display:flex;align-items:center;gap:22px;animation:rowIn .55s var(--ease-out) backwards;animation-delay:{{ j.animDelay }}\">\n              <image-slot id=\"{{ j.imgId }}\" shape=\"rounded\" radius=\"12\" placeholder=\"{{ j.imgPlaceholder }}\" style=\"width:212px;height:142px;flex:none\"><\u002Fimage-slot>\n Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div data-reveal=\"up\" style=\"margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch\">\n\n          <div class=\"lift\" onclick=\"{{ openEnablement }}\" style=\"cursor:pointer;background:linear-gradient(100deg,#1A3856 0%,#0063C3 100%);border-radius:16px;padding:20px 24px;display:flex;align-items:center;gap:16px\">\n            <span style=\"width:46px;height:46px;border-radius:11px;background:rgba(255,255,255,0.16);display:grid;place-items:center;flex:none\">\n              <svg viewBox=\"0 0 24 24\" width=\"25\" height=\"25\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3.5\" width=\"18\" height=\"12.5\" rx=\"1.5\"><\u002Frect><path d=\"M7.5 12l2.6-2.6 2 2 3.4-3.4\"><\u002Fpath><path d=\"M12 16v3.2M8.8 21l3.2-1.8 3.2 1.8\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"font-family:var(--font-display);font-weight:700;font-size:16px;color:#fff\">Change Management &amp; Enablement Plan<\u002Fdiv>\n              <div style=\"font-size:13px;color:rgba(255,255,255,0.82);margin-top:2px\">Onboarding &amp; certification for staff and agency partners<\u002Fdiv>\n            <\u002Fdiv>\n            <span class=\"goarr-en\" style=\"width:42px;height:42px;flex:none;border-radius:50%;background:rgba(255,255,255,0.16);color:#fff;display:grid;place-items:center;font-size:18px;transition:all var(--dur-base) var(--ease-out)\">→<\u002Fspan>\n          <\u002Fdiv>\n\n          <div class=\"lift\" onclick=\"{{ openKpi }}\" style=\"cursor:pointer;background:linear-gradient(100deg,#0063C3 0%,#00A3E0 100%);border-radius:16px;padding:20px 24px;display:flex;align-items:center;gap:16px\">\n            <span style=\"width:46px;height:46px;border-radius:11px;background:rgba(255,255,255,0.18);display:grid;place-items:center;flex:none\">\n              <svg viewBox=\"0 0 24 24\" width=\"25\" height=\"25\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20V4\"><\u002Fpath><path d=\"M4 20h16\"><\u002Fpath><path d=\"M7 16l4-4 3 2.5 5-6\"><\u002Fpath><path d=\"M19 8.5h-2.4M19 8.5v2.4\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"font-family:var(--font-display);font-weight:700;font-size:16px;color:#fff\">Operational KPIs &amp; Success Factors<\u002Fdiv>\n              <div style=\"font-size:13px;color:rgba(255,255,255,0.9);margin-top:2px\">See what's possible when reporting on success of this initiative<\u002Fdiv>\n            <\u002Fdiv>\n            <span class=\"goarr-en\" style=\"width:42px;height:42px;flex:none;border-radius:50%;background:rgba(255,255,255,0.18);color:#fff;display:grid;place-items:center;font-size:18px;transition:all var(--dur-base) var(--ease-out)\">→<\u002Fspan>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== JOURNEY OVERVIEW ===================== -->\n  <sc-if value=\"{{ isOverview }}\" hint-placeholder-val=\"{{ true }}\">\n    <div class=\"fade-in\" style=\"min-height:100vh;display:flex;flex-direction:column;background:var(--am-page)\">\n      <div style=\"height:64px;flex:none;background:#fff;border-bottom:1px solid var(--am-hairline);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,4vw,40px);position:sticky;top:0;z-index:10\">\n        <div style=\"display:flex;align-items:center;gap:14px\">\n          <img src=\"b4203065-d4be-4ad9-8458-7e0bfdc00ed3\" alt=\"Amgen\" title=\"Back to start\" class=\"homelink\" onclick=\"{{ goSplash }}\" style=\"height:22px;width:auto;display:block\">\n          <span style=\"width:1px;height:20px;background:var(--am-hairline)\"><\u002Fspan>\n          <span style=\"font-family:var(--font-disp lor:var(--text-strong)\">UTM parameters<\u002Fdiv><div style=\"font-size:12.5px;color:var(--text-muted);margin-top:1px\">Tagged landing-page URL for analytics<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:13px;padding:11px 13px;background:var(--am-page);border-radius:8px;font-family:var(--font-mono);font-size:12px;line-height:1.5;color:var(--am-blue);word-break:break-all\">{{ reviewData.utm }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;justify-content:center;gap:14px;margin-top:40px;flex-wrap:wrap\">\n          <button class=\"btn-press\" onclick=\"{{ startWork }}\" style=\"display:inline-flex;align-items:center;gap:9px;padding:15px 28px;border:1px solid var(--am-hairline);background:#fff;color:var(--text-strong);border-radius:11px;font-family:var(--font-display);font-weight:700;font-size:15px;cursor:pointer\">↺ Replay scenario<\u002Fbutton>\n          <button class=\"btn-press\" onclick=\"{{ backToMenu }}\" style=\"display:inline-flex;align-items:center;gap:10px;padding:15px 32px;background:var(--am-blue);color:#fff;border:none;border-radius:11px;font-family:var(--font-display);font-weight:700;font-size:16px;cursor:pointer;box-shadow:var(--shadow-block-accent)\">Back to scenario menu <span style=\"font-size:18px\">→<\u002Fspan><\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== ENABLEMENT HUB (dark / Tigerhall) ===================== -->\n  <sc-if value=\"{{ isEnablement }}\" hint-placeholder-val=\"{{ true }}\">\n    <div class=\"fade-in\" style=\"min-height:100vh;display:flex;flex-direction:column;background:#0e1622\">\n\n      <!-- top bar -->\n      <div style=\"height:64px;flex:none;background:#121b27;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,4vw,40px);position:sticky;top:0;z-index:20\">\n        <div style=\"display:flex;align-items:center;gap:14px\">\n          <img src=\"3a3d12e7-24b5-4eb2-b993-89a22d97913c\" alt=\"Amgen\" title=\"Back to start\" class=\"homelink\" onclick=\"{{ goSplash }}\" style=\"height:22px;width:auto;display:block\">\n          <span style=\"width:1px;height:20px;background:rgba(255,255,255,0.18)\"><\u002Fspan>\n          <span style=\"font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.72)\">Enablement Plan<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(255,125,69,0.16);font-family:var(--font-display);font-weight:700;font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;color:#ff9466\">Powered by Tigerhall<\u002Fspan>\n        <\u002Fdiv>\n        <button class=\"btn-press\" onclick=\"{{ backToMenu }}\" style=\"display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border:1px solid rgba(255,255,255,0.16);background:transparent;border-radius:999px;font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:#eaf0f7;cursor:pointer;white-space:nowrap\">← All scenarios<\u002Fbutton>\n      <\u002Fdiv>\n\n      <!-- LANDING: choose a Trail -->\n      <sc-if value=\"{{ enIsLanding }}\" hint-placeholder-val=\"{{ true }}\">\n        <div class=\"fade-in\" style=\"flex:1;width:100%;max-width:1080px;margin:0 auto;padding:clamp(28px,4vw,52px) clamp(20px,4vw,40px) 80px;box-sizing:border-box\">\n          <span style=\"font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#ff9466\">Change Management &amp; Agency Enablement<\u002Fspan>\n          <h1 style=\"font-family:var(--font-display);font-weight:700;letter-spacing:-0.02em;font-size:clamp(30px,4vw,46px);line-height:1.05;color:#eaf0f7;margin:10px 0 0\">Confidence and consistency, at every step.<\u002Fh1>\n          <p style=\"font-size:clamp(15px,1.5vw,18px);line-height:1.65;color:#93a1b3;margin:16px 0 0;max-width:88ch\">Adoption doesn't happen because a playbook exists. It happens because every person who touches the taxonomy workflow — brand, ops, analytics, or agency — knows exactly what changed, why it matters to them, and what they need to do differently. Merkle's approach runs on three pillars.<\u002Fp>\n\n          <!-- three pillars -->\n          <div data-reveal=\"up\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:34px\">\n\n            <div class=\"en-card\" style=\"background:#1c2734;border:1px solid rgba(255,255,255,0.10);border-radius:16px;padding:24px 22px;display:flex;flex-direction:column;gap:12px\">\n              <span style=\"font-family:var(--font-display);font-weight:800;font-size:40px;line-height:1;color:#4ca3ff\">01<\u002Fspan>\n              <div>\n                <h3 style=\"font-family:var(--font-display);font-weight:700;font-size:18px;line-height:1.2;color:#eaf0f7;margin:0\">Team-based training &amp; communications<\u002Fh3>\n                <p style=\"font-size:13.5px;line-height:1.55;color:#93a1b3;margin:9px 0 0\">Role-specific playbooks built around real Amgen campaign scenarios. A communications plan that drives awareness before go-live and sustains it after.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"en-card\" style=\"background:#1c2734;border:1px solid rgba(255,255,255,0.10);border-radius:16px;padding:24px 22px;display:flex;flex-direction:column;gap:12px\">\n              <span style=\"font-family:var(--font-display);font-weight:800;font-size:40px;line-height:1;color:#4ca3ff\">02<\u002Fspan>\n              <div>\n                <h3 style=\"font-family:var(--font-display);font-weight:700;font-size:18px;line-height:1.2;color:#eaf0f7;margin:0\">Center of Excellence<\u002Fh3>\n                <p style=\"font-size:13.5px;line-height:1.55;color:#93a1b3;margin:9px 0 0\">A governance body that fields change requests, resolves exceptions, and owns adoption metrics — with Merkle providing oversight and rapid response capacity throughout.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"en-card\" style=\"background:#1c2734;border:1px solid rgba(255,255,255,0.10);border-radius:16px;padding:24px 22px;display:flex;flex-direction:column;gap:12px\">\n              <span style=\"font-family:var(--font-display);font-weight:800;font-size:40px;line-height:1;color:#4ca3ff\">03<\u002Fspan>\n              <div>\n                <h3 style=\"font-family:var(--font-display);font-weight:700;font-size:18px;line-height:1.2;color:#eaf0f7;margin:0\">Feedback loops &amp; product iterations<\u002Fh3>\n                <p style=\"font-size:13.5px;line-height:1.55;color:#93a1b3;margin:9px 0 0\">Phased rollout with pilot teams validating before broader deployment. Response cycles that fix what isn't working before it compounds.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n          <\u002Fdiv>\n\n          <!-- divider into trails -->\n          <div data-reveal=\"up\" style=\"text-align:left;margin:54px 0 0;max-width:none\">\n            <div style=\"width:48px;height:3px;border-radius:2px;background:rgba(255,255,255,0.14);margin:0 0 26px\"><\u002Fdiv>\n            <p style=\"font-size:clamp(15px,1.5vw,18px);line-height:1.65;color:#93a1b3;margin:0;max-width:none\">Each pillar is only as strong as the people behind it. That's why agency partners and internal Amgen staff each follow purpose-built learning trails inside TigerHall, Amgen's learning and enablement platform — certifiable, trackable, and scoped to what each audience actually controls.<\u002Fp>\n            <div style=\"font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#ff9466;margin-top:30px\">Choose Your Trail<\u002Fdiv>\n          <\u002Fdiv>\n          <div data-reveal=\"scale\" style=\"margin-top:18px\">{{ enLandingEl }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- TRAIL VIEW: sidebar + panel -->\n      <sc-if value=\"{{ enPanelEl }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"flex:1;width:100%;max-width:1200px;margin:0 auto;padding:clamp(20px,3vw,32px) clamp(16px,3vw,32px) 70px;box-sizing:border-box;display:flex;gap:26px;align-items:flex-start\">\n\n          <!-- sidebar -->\n          <div style=\"width:268px;flex:none;position:sticky;top:88px;background:#161f2c;border:1px solid rgba(255,255,255,0.10);border-radius:16px;padding:20px 16px\">\n            <button class=\"btn-press\" onclick=\"{{ backToHub }}\" style=\"display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid rgba(255,255,255,0.14);background:transparent;border-radius:999px;font-family:var(--font-display);font-weight:700;font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;color:#eaf0f7;cursor:pointer;margin-bottom:14px\">← Both Trails<\u002Fbutton>\n            <image-slot id=\"{{ enSideImgId }}\" shape=\"rounded\" radius=\"12\" placeholder=\"{{ enSidePlaceholder }}\" style=\"width:100%;height:104px;display:block;margin-bottom:16px\"><\u002Fimage-slot>\n            <div style=\"display:flex;align-items:center;gap:9px;padding:0 6px 14px;border-bottom:1px solid rgba(255,255,255,0.08);margin-bottom:16px\">\n              <span style=\"width:9px;height:9px;border-radius:50%;background:{{ enTrailAccent }}\"><\u002Fspan>\n              <span style=\"font-family:var(--font-display);font-weight:700;font-size:14px;color:#eaf0f7\">{{ enTrailTitle }} Trail<\u002Fspan>\n            <\u002Fdiv>\n            {{ enSidebarEl }}\n          <\u002Fdiv>\n\n          <!-- main panel -->\n          <div style=\"flex:1;min-width:0;background:#161f2c;border:1px solid rgba(255,255,255,0.10);border-radius:16px;padding:clamp(22px,2.4vw,32px)\">\n            {{ enPanelEl }}\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== GROUNDING IN FOUNDATIONS (light) ===================== -->\n  <sc-if value=\"{{ isFoundations }}\" hint-placeholder-val=\"{{ true }}\">\n    <div class=\"fade-in\" style=\"min-height:100vh;display:flex;flex-direction:column;background:var(--am-page)\">\n      <div style=\"height:64px;flex:none;background:#fff;border-bottom:1px solid var(--am-hairline);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,4vw,40px);position:sticky;top:0;z-index:20\">\n        <div style=\"display:flex;align-items:center;gap:14px\">\n          <img src=\"b4203065-d4be-4ad9-8458-7e0bfdc00ed3\" alt=\"Amgen\" title=\"Back to start\" class=\"homelink\" onclick=\"{{ goSplash }}\" style=\"height:22px;width:auto;display:block\">\n          <span style=\"width:1px;height:20px;background:var(--am-hairline)\"><\u002Fspan>\n          <span style=\"font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-muted)\">Grounding in foundations<\u002Fspan>\n        <\u002Fdiv>\n        <button class=\"btn-press\" onclick=\"{{ backToMenu }}\" style=\"display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border:1px solid var(--am-hairline);background:#fff;border-radius:999px;font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-strong);cursor:pointer;white-space:nowrap\">← All scenarios<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"flex:1;width:100%;max-width:1180px;margin:0 auto;padding:clamp(28px,4vw,52px) clamp(20px,4vw,40px) 70px;box-sizing:border-box;display:grid;grid-template-columns:0.82fr 1fr;gap:clamp(30px,4vw,56px);align-items:start\">\n\n        <div data-reveal=\"up\" style=\"position:sticky;top:96px\">\n          <span style=\"font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--am-blue)\">Foundations<\u002Fspan>\n          <h1 style=\"font-family:var(--font-display);font-weight:700;letter-spacing:-0.02em;font-size:clamp(30px,3.8vw,46px);line-height:1.05;color:var(--text-strong);margin:10px 0 0\">Grounding this demonstration and our approach<\u002Fh1>\n          <p style=\"font-size:clamp(16px,1.6vw,18px);line-height:1.6;color:var(--text-body);margin:18px 0 0;max-width:46ch\">Every program of this scale requires critical foundations — the technology, the taxonomy itself, and a consistent process to run it time and time again.<\u002Fp>\n          <p style=\"font-size:15px;line-height:1.6;color:var(--text-body);margin:16px 0 0;max-width:46ch\">Shown to the right are the three core foundations threaded throughout our proposal: a high-level methodology for production operations, the technology and channels we've built working knowledge of alongside your team, and the data that drives the critical nature of this taxonomy initiative.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <sc-for list=\"{{ foundTiles }}\" as=\"f\" hint-placeholder-count=\"3\">\n            <div class=\"jrow\" onclick=\"{{ f.onOpen }}\" style=\"background:#fff;border:1px solid var(--am-hairline);border-radius:16px;box-shadow:var(--shadow-sm);padding:16px;display:flex;align-items:center;gap:18px;animation:rowIn .55s var(--ease-out) backwards;animation-delay:{{ f.animDelay }}\">\n              {{ f.iconEl }}\n              <div style=\"flex:1;min-width:0\">\n                <h3 style=\"font-family:var(--font-display);font-weight:700;font-size:clamp(17px,1.7vw,20px);color:var(--text-strong);margin:0\">{{ f.title }}<\u002Fh3>\n                <p style=\"font-size:13.5px;line-height:1.5;color:var(--text-muted);margin:7px 0 0\">{{ f.desc }}<\u002Fp>\n              <\u002Fdiv>\n              <span class=\"goarr\" style=\"flex:none;width:42px;height:42px;border-radius:50%;background:var(--am-blue-12);color:var(--am-blue);display:grid;place-items:center;font-size:18px;transition:all var(--dur-base) var(--ease-out)\">→<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n      {{ foundModalEl }}\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== OPERATIONAL KPIs (dark) ===================== -->\n  <sc-if value=\"{{ isKpi }}\" hint-placeholder-val=\"{{ true }}\">\n    <div class=\"fade-in\" style=\"min-height:100vh;display:flex;flex-direction:column;background:#0e1622\">\n      <div style=\"height:64px;flex:none;background:#121b27;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,4vw,40px);position:sticky;top:0;z-index:20\">\n        <div style=\"display:flex;align-items:center;gap:14px\">\n          <img src=\"3a3d12e7-24b5-4eb2-b993-89a22d97913c\" alt=\"Amgen\" title=\"Back to start\" class=\"homelink\" onclick=\"{{ goSplash }}\" style=\"height:22px;width:auto;display:block\">\n          <span style=\"width:1px;height:20px;background:rgba(255,255,255,0.18)\"><\u002Fspan>\n          <span style=\"font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.72)\">Operational KPIs &amp; Success Factors<\u002Fspan>\n        <\u002Fdiv>\n        <button class=\"btn-press\" onclick=\"{{ backToMenu }}\" style=\"display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border:1px solid rgba(255,255,255,0.16);background:transparent;border-radius:999px;font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:#eaf0f7;cursor:pointer;white-space:nowrap\">← All scenarios<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"flex:1;width:100%;max-width:1080px;margin:0 auto;padding:clamp(28px,4vw,48px) clamp(20px,4vw,40px) 80px;box-sizing:border-box\">\n        <div style=\"margin-bottom:38px\">\n          <span style=\"font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#00BCE4\">Performance intelligence<\u002Fspan>\n          <h1 style=\"font-family:var(--font-display);font-weight:700;letter-spacing:-0.02em;font-size:clamp(30px,4vw,46px);line-height:1.05;color:#eaf0f7;margin:10px 0 0\">Govern what you can measure<\u002Fh1>\n          <p style=\"font-size:clamp(15px,1.5vw,18px);line-height:1.65;color:#93a1b3;margin:16px 0 0;max-width:none\">A unified view of taxonomy adoption, platform readiness, and campaign attribution — giving the COE and functional leads the signal they need to enforce standards and demonstrate ROI. The dashboard below is an illustration of what becomes possible when every asset, tactic, and campaign carries a governed ID: a single pane of glass from Claravine validation through to reporting outcomes, with no manual reconciliation in between.<\u002Fp>\n        <\u002Fdiv>\n        {{ kpiBodyEl }}\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:820}}\">\nconst PHASES = [\"Align\", \"Build\", \"Govern\", \"Activate\", \"Analyze\", \"Adapt\"];\n\nconst JOURNEYS = [\n  {\n    n: \"01\", audience: \"Agency + Staff\", brand: \"Evenity\",\n    title: \"New channel media placement\",\n    blurb: \"Bolt net-new channels onto an existing Evenity campaign, with the agency planning and trafficking under Amgen governance.\",\n    overview: \"A new media placement for Evenity bolts onto an existing campaign with net-new channels. The brand team writes the brief, the agency develops the strategy, the COE generates and distributes taxonomy through Claravine, and the agency traffics with validated IDs under a no-ID, no-launch policy — all reporting joined cleanly in Tableau.\",\n    imgPlaceholder: \"Drop Evenity campaign imagery\",\n    steps: [\n      { phase: \"Align\", title: \"Brand staff creates brief\", people: \"Amgen brand manager authors a campaign brief that includes intent, objectives, audience targeting, related and historic campaigns, and the desired creative direction for the Evenity media campaign.\", process: \"Campaign brief documented with creative direction, channel goals, and audience parameters; submitted for agency intake in Workfront.\", platforms: [\"Workfront\"] },\n      { phase: \"Align\", title: \"Brief routed to agency\", people: \"Workfront project coordinator assigns the brief to IPG; agency account lead acknowledges intake.\", process: \"Brief formally logged, assigned, and tracked; agency confirms receipt and begins strategy development.\", platforms: [\"Workfront\"] },\n      { phase: \"Build\", title: \"Agency develops strategy & recommendations\", people: \"IPG develops placement strategy, channel mix, and creative recommendations.\", process: \"IPG builds a media plan including channel selection, format recommendations, and audience targeting rationale; returns to Amgen Brand Lead for review.\", platforms: [\"Prisma\", \"Workfront\"] },\n      { phase: \"Govern\", title: \"Brand approves & requests taxonomy IDs\", people: \"IPG appends the taxonomy based on variations in this campaign; the Amgen COE Taxonomy Owner reviews and approves.\", process: \"Using existing campaign taxonomy in Claravine as a foundation, the agency drafts and submits a proposal in Workfront that accounts for new media channel additions, the flight release date, and relevant asset versions; once submitted, the Amgen COE reviews the appended taxonomy; upon approval, the COE notifies the agency in Workfront that the updates are cleared, then adds the finalized taxonomy into Claravine as the source of truth.\", platforms: [\"Claravine\", \"Workfront\"] },\n      { phase: \"Govern\", title: \"Taxonomy generated & pushed back for staff approval\", people: \"COE Tagging Associate (Media) generates updates against the existing Evenity record; brand manager reviews and approves.\", process: \"Strings and IDs auto-generated for new components and tagged back into Workfront for review; on approval, staff push into Claravine to establish the source of truth.\", platforms: [\"Claravine\", \"Workfront\"] },\n      { phase: \"Govern\", title: \"Claravine distributes taxonomy across systems\", people: \"COE Taxonomy Owner confirms distribution; platform leads validate receipt in each downstream system.\", process: \"Claravine pushes validated taxonomy, naming conventions, and IDs to all connected platforms; no manual re-entry required; an audit trail is created.\", platforms: [\"Claravine\"] },\n      { phase: \"Activate\", title: \"Agency traffics placements\", people: \"IPG media operations team traffics placements using validated IDs and naming sourced from Claravine.\", process: \"Tactic ID embedded in each placement; Asset ID attached to each creative unit; the no-ID, no-launch policy is enforced before go-live.\", platforms: [\"Meta\", \"DV360\"] },\n      { phase: \"Analyze\", title: \"Reporting through Tableau\", people: \"Amgen analytics team and brand manager review campaign performance.\", process: \"Tableau pulls downstream data from iDNA, which sits on top of AWS; Tableau surfaces cross-channel performance using the same taxonomy applied at setup.\", platforms: [\"Tableau\", \"AWS\", \"iDNA\"] },\n      { phase: \"Adapt\", title: \"Flag exceptions & iterate\", people: \"COE Tagging Associate (Media) reviews reconciliation exceptions; IPG and brand manager align on updates.\", process: \"Naming or ID discrepancies flagged in the weekly QA cadence; remediation routed through the COE change-request process; taxonomy versioned in Claravine before the next flight.\", platforms: [\"Claravine\", \"Workfront\"] }\n    ]\n  },\n  {\n    n: \"02\", audience: \"Staff\", brand: \"Otezla\",\n    title: \"HCP email refresh\",\n    blurb: \"Build and deploy a refreshed HCP email campaign covering side effects and success stories, fully governed in-house.\",\n    overview: \"A refreshed HCP email campaign for Otezla covers side effects and success stories. Staff define the brief with medical affairs, build the journey in Salesforce Marketing Cloud with governed fields, tag assets in Veeva Vault, route MAC approval through Veeva Vault, and clear a Claravine validation gate before deployment — with engagement measured against the same IDs in Tableau.\",\n    imgPlaceholder: \"Drop Otezla HCP imagery\",\n    steps: [\n      { phase: \"Align\", title: \"Brand staff creates brief\", people: \"Amgen brand manager and medical affairs lead define objectives, HCP audience parameters, and key messages for Otezla.\", process: \"Brief covers educational goals, side-effect communication, success-story inclusion, and compliance considerations; submitted internally for review and resourcing.\", platforms: [\"Workfront\"] },\n      { phase: \"Align\", title: \"Campaign scope confirmed with COE & regulatory\", people: \"COE Taxonomy Owner, brand manager, and regulatory lead align on structure, mandatory metadata, and MAC requirements.\", process: \"Program ID confirmed or created; AudienceType taxonomy term set to Healthcare Professional; regulatory review timeline established before any build begins.\", platforms: [\"Claravine\"] },\n      { phase: \"Build\", title: \"Campaign structure built in SFMC\", people: \"Marketing operations team builds email journey templates; brand manager provides content direction.\", process: \"CampaignID, TacticID, and AudienceID applied to the journey template at creation; picklists and controlled vocabulary enforced; no free-text entry for governed fields.\", platforms: [\"Salesforce MC\", \"Claravine\"] },\n      { phase: \"Build\", title: \"Assets created & tagged in Veeva Vault\", people: \"Creative team develops email assets; content manager applies metadata in Veeva Vault DAM.\", process: \"Each asset assigned an AssetID on upload; MACID, KeyMessageID, AssetLanguage, and AssetFormat populated per the taxonomy schema; assets linked to the active CampaignID.\", platforms: [\"Adobe AEM\", \"Veeva Vault\"] },\n      { phase: \"Govern\", title: \"MAC approval routed through Veeva Vault\", people: \"Regulatory reviews HCP-facing content; medical, legal, and regulatory reviewers complete sign-off.\", process: \"MACID generated and linked to each asset record; approval status updated in Veeva Vault and synced back to AEM DAM; no asset cleared for deployment without a confirmed MACID.\", platforms: [\"Veeva Vault\", \"Adobe AEM\"] },\n      { phase: \"Govern\", title: \"Mandatory field validation before launch\", people: \"COE Tagging Associate confirms all required fields are populated across campaign, tactic, and asset records.\", process: \"Claravine validation gate runs pre-launch checks across all taxonomy fields; missing mandatory fields block progression; exceptions escalated to the COE for resolution.\", platforms: [\"Claravine\"] },\n      { phase: \"Activate\", title: \"Email journey deployed via SFMC\", people: \"Marketing operations team triggers deployment; brand manager confirms go-live.\", process: \"Email journey activated with governed metadata intact; AudienceID, CampaignID, and TacticID embedded in the send configuration for downstream tracking; deployment logged against the campaign record.\", platforms: [\"Salesforce MC\"] },\n      { phase: \"Analyze\", title: \"Engagement data reviewed in Tableau\", people: \"Analytics team and brand manager review HCP engagement performance.\", process: \"Open rates, click activity, and engagement codes pulled into Tableau and joined against AudienceID and CampaignID; performance reviewed by key message and asset version.\", platforms: [\"Tableau\", \"Salesforce MC\"] },\n      { phase: \"Adapt\", title: \"Optimize & submit change requests\", people: \"Brand manager and COE Tagging Associate review performance
